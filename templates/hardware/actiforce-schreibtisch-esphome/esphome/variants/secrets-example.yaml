# ============================================================================
# ESPHome Secrets – Beispieldatei
# ----------------------------------------------------------------------------
# Diese Datei nach "secrets.yaml" kopieren und mit den eigenen Werten füllen.
# "secrets.yaml" NICHT ins Git-Repository committen (siehe .gitignore)!
# ============================================================================

# --- WLAN-Zugangsdaten ---
wifi_ssid: "MeinNetzwerk"
wifi_password: "MeinWLANPasswort"

# --- Fallback Access-Point Passwort (wenn WLAN nicht erreichbar) ---
ap_password: "EinSicheresAPPasswort"

# --- Statische Netzwerk-Konfiguration (optional) ---
# Wird in schreibtisch.yaml unter "manual_ip" verwendet.
# Wer DHCP nutzen möchte, entfernt den "manual_ip"-Block in der YAML
# und kann diese beiden Zeilen weglassen.
static_ip: "192.168.178.50"   # Gewünschte feste IP des ESP32
gateway: "192.168.178.1"      # IP des Routers
